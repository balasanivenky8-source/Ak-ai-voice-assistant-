<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JARVIS AI</title>

  <link rel="stylesheet" href="/styles/jarvis.css">
</head>

<body>

  <main class="jarvis">

    <header>
      <h1>JARVIS</h1>
      <p id="status">SYSTEM READY</p>
    </header>

    <section class="core">

      <div id="orb">
        <div class="ring"></div>
        <div class="core-dot"></div>
      </div>

      <button id="micButton">
        🎙️
      </button>

    </section>

    <section class="conversation">

      <div id="messages"></div>

      <div class="input-row">
        <input
          id="messageInput"
          placeholder="Talk to JARVIS..."
          autocomplete="off"
        >

        <button id="sendButton">
          SEND
        </button>
      </div>

    </section>

  </main>

  <script type="module" src="/src/app.js"></script>

</body>
</html>
